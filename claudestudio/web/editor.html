<!doctype html><meta charset="utf-8"><title>Claude Studio Editor</title><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#1e1f22;--panel:#2b2d31;--line:#3a3c42;--text:#e3e5e8;--dim:#9aa0a6;--sel:#0d6efd;--accent:#4aa3ff}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,-apple-system,sans-serif;touch-action:none}
#ui{position:fixed;top:0;left:0;right:0;height:44px;display:flex;gap:4px;align-items:center;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;z-index:2}
#ui button{flex:none;height:32px;min-width:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#33363c;color:var(--text);font:inherit;cursor:pointer}
#ui button.on{background:var(--sel);border-color:var(--sel)}#ui button:disabled{opacity:.4}
#ui button.play{background:#2e8b57;border-color:#2e8b57}
#ui select{flex:none;height:32px;background:#33363c;color:var(--text);border:1px solid var(--line);border-radius:6px}
#editbar{display:none;position:fixed;top:44px;left:240px;right:280px;height:40px;gap:4px;align-items:center;padding:0 6px;background:#3a2a1a;border-bottom:1px solid #6b4a24;overflow-x:auto;z-index:2}
body.editing #editbar{display:flex}
#terrainbar{position:fixed;top:44px;left:240px;right:280px;height:40px;display:flex;gap:6px;align-items:center;padding:0 6px;background:#1d2e22;border-bottom:1px solid #2f5a3a;overflow-x:auto;z-index:2}#terrainbar[hidden]{display:none}
#terrainbar button,#terrainbar select{flex:none;height:30px;padding:0 10px;border:1px solid #2f5a3a;border-radius:6px;background:#26402d;color:var(--text);font:inherit}#terrainbar button.on{background:#2e8b57;border-color:#2e8b57}#terrainbar label{flex:none;display:flex;gap:4px;align-items:center;white-space:nowrap}#terrainbar input[type=range]{width:90px}#terrainbar .sep{flex:none;width:1px;height:22px;background:#2f5a3a;margin:0 4px}
#paintbar{position:fixed;top:44px;left:240px;right:280px;height:40px;display:flex;gap:6px;align-items:center;padding:0 6px;background:#2a2238;border-bottom:1px solid #4a3a66;overflow-x:auto;z-index:2}#paintbar[hidden]{display:none}
#paintbar button{flex:none;height:30px;padding:0 10px;border:1px solid #4a3a66;border-radius:6px;background:#352a48;color:var(--text);font:inherit}#paintbar button.on{background:#7a4fc9;border-color:#7a4fc9}#paintbar label{flex:none;display:flex;gap:4px;align-items:center;white-space:nowrap}#paintbar input[type=range]{width:80px}#paintbar input[type=color]{flex:none;width:36px;height:30px;padding:0;border:1px solid #4a3a66;border-radius:6px;background:none}#paintbar .sep{flex:none;width:1px;height:22px;background:#4a3a66;margin:0 4px}
#editbar button{flex:none;height:30px;padding:0 10px;border:1px solid #6b4a24;border-radius:6px;background:#4a3420;color:var(--text);font:inherit}#editbar button.on{background:#e07b1a;border-color:#e07b1a}#editbar .sep{flex:none;width:1px;height:22px;background:#6b4a24;margin:0 4px}
#lastop{position:fixed;left:250px;bottom:12px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:10px;align-items:center}#lastop[hidden]{display:none}#lastop input{width:64px;background:#1f2125;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 4px}#lastop .st{color:var(--dim)}
#animpanel{position:fixed;left:240px;right:280px;bottom:0;height:224px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);z-index:2}#animpanel[hidden]{display:none}
.abar{flex:none;height:38px;display:flex;gap:6px;align-items:center;padding:0 6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.abar button,.abar select{flex:none;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#33363c;color:var(--text);font:inherit}.abar label{flex:none;white-space:nowrap}.atime{flex:none;min-width:58px;color:var(--dim);font-variant-numeric:tabular-nums}
.abody{flex:1;display:flex;min-height:0;overflow:hidden}.anames{flex:none;width:84px;border-right:1px solid var(--line);overflow:hidden}
.aname{line-height:24px;padding:0 6px;cursor:pointer;white-space:nowrap;font-size:12px;overflow:hidden;text-overflow:ellipsis}.aname.on{background:var(--sel)}
.astrip{flex:1;min-width:0;position:relative}
body.animating #c{height:calc(100% - 44px - 224px)}
#ui .sep{flex:none;width:1px;height:24px;background:var(--line);margin:0 4px}
#c{position:fixed;top:44px;left:240px;right:280px;bottom:0;width:calc(100% - 520px);height:calc(100% - 44px);display:block;outline:none}
.side{position:fixed;top:44px;bottom:0;background:var(--panel);overflow:auto;z-index:1}
#explorer{left:0;width:240px;border-right:1px solid var(--line)}#properties{right:0;width:280px;border-left:1px solid var(--line)}
.row{white-space:nowrap;padding:3px 4px;cursor:pointer}.row:hover{background:#34373d}.row.sel{background:var(--sel)}
.tw{display:inline-block;width:14px;color:var(--dim)}.cls{color:var(--dim);font-size:11px;margin-right:2px}
.head{padding:8px;font-weight:600;border-bottom:1px solid var(--line)}.grp{padding:6px 8px 2px;color:var(--dim);font-size:11px;text-transform:uppercase}
.prop{display:flex;align-items:center;gap:6px;padding:2px 8px}.prop>span:first-child{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop input,.prop select{flex:1;min-width:0;background:#1f2125;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 4px;font:inherit}
.prop input[type=checkbox]{flex:none}.v3{flex:1;display:flex;gap:2px;min-width:0}.v3 input{width:0}.ref{color:var(--dim)}.empty{padding:12px;color:var(--dim)}
#ui [data-act=panels]{display:none}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 12px;border-radius:6px;background:rgba(0,0,0,.7);color:#fff;z-index:3;pointer-events:none}
@media (max-width:760px){
  #editbar{left:0;right:0}#terrainbar{left:0;right:0}#paintbar{left:0;right:0}#animpanel{left:0;right:0;height:42%}body.animating #c{height:calc(58% - 44px)}#lastop{left:8px;right:8px;bottom:8px;flex-wrap:wrap}
  #c{left:0;right:0;width:100%}
  .side{display:none;top:auto;height:42%;left:0;right:0;width:auto;border:0;border-top:1px solid var(--line)}
  body.panels #explorer{display:block;right:50%}body.panels #properties{display:block;left:50%}
  #ui [data-act=panels]{display:block}
}
</style>
<div id="ui">
  <button data-tool="select" title="Select (Ctrl+1)">Select</button><button data-tool="move" title="Move (Ctrl+2)">Move</button><button data-tool="scale" title="Scale (Ctrl+3)">Scale</button><button data-tool="rotate" title="Rotate (Ctrl+4)">Rotate</button>
  <span class="sep"></span>
  <button data-act="part" title="Insert a Part">Part</button><select id="meshKind" title="Mesh to insert"><option>cube</option><option>uvSphere</option><option>icoSphere</option><option>cylinder</option><option>cone</option><option>torus</option><option>capsule</option><option>plane</option><option>grid</option><option>circle</option></select><button data-act="mesh" title="Insert an editable mesh">Mesh</button><button data-act="editmesh" title="Edit Mesh (Tab)">Edit Mesh</button><button data-act="terrain" title="Terrain Editor: Add, Subtract, Paint, Smooth, Flatten">Terrain</button><button data-act="paint" title="Paint on a MeshPart's texture, or on a part's face (as a Decal)">Paint</button><button data-act="rig" title="Insert a Rig (a character to animate)">Rig</button><button data-act="animate" title="Animate the selected rig">Animate</button><button data-act="duplicate" title="Duplicate (Ctrl+D)">Duplicate</button><button data-act="delete" title="Delete">Delete</button><button data-act="group" title="Group (Ctrl+G)">Group</button><button data-act="ungroup" title="Ungroup (Ctrl+U)">Ungroup</button>
  <span class="sep"></span>
  <button data-act="play" title="Play" class="play">Play</button><button data-act="save" title="Save the place file">Save</button><button data-act="open" title="Open a place file">Open</button>
  <span class="sep"></span>
  <button data-act="undo" title="Undo (Ctrl+Z)">Undo</button><button data-act="redo" title="Redo (Ctrl+Y)">Redo</button><button data-act="focus" title="Focus (F)">Focus</button><button data-act="panels">Panels</button>
</div>
<div id="hint" hidden></div>
<div id="editbar"><button data-mode="vertex" title="Vertex select (1)">Vertex</button><button data-mode="edge" title="Edge select (2)">Edge</button><button data-mode="face" title="Face select (3)">Face</button><span class="sep"></span><button data-op="extrude" title="Extrude (E)">Extrude</button><button data-op="inset" title="Inset (I)">Inset</button><button data-op="bevel" title="Bevel (Ctrl+B)">Bevel</button><button data-op="loopCut" title="Loop cut (Ctrl+R)">Loop Cut</button><button data-op="subdivide">Subdivide</button><button data-op="merge" title="Merge (M)">Merge</button><button data-op="fill" title="Fill (F)">Fill</button><button data-op="delete" title="Delete (X)">Delete</button><span class="sep"></span><button data-done title="Leave Edit Mode (Tab)">Done</button></div>
<div id="lastop" hidden></div>
<div id="animpanel" hidden></div>
<div id="terrainbar" hidden></div>
<div id="paintbar" hidden></div>
<input type="file" id="openFile" accept=".json,application/json" hidden>
<div id="explorer" class="side"></div><div id="properties" class="side"></div>
<canvas id="c"></canvas><script type="module" src="../build/web/editor.js"></script>
