<!doctype html><meta charset="utf-8"><title>Character Maker</title><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#15171c;--panel:#1e2128;--line:#2e333d;--text:#e8eaef;--dim:#9aa1ad;--accent:#5aa9ff;--ok:#5fd18b;--warn:#f0b35a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 16px 32px;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){main{grid-template-columns:1fr 1fr}}
h1{font-size:19px;margin:4px 0 0;grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--dim);font-weight:600}
#ref{width:100%;aspect-ratio:3/4;display:block;background:#2a2e36;border-radius:8px;touch-action:none}
#view{width:100%;aspect-ratio:3/4;display:block;border-radius:8px;outline:none;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button,label.btn{background:#2b303a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer;min-height:40px}
button.on{background:var(--accent);border-color:var(--accent);color:#0b1220}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600}
.samples img{width:44px;height:58px;object-fit:contain;background:#2a2e36;border-radius:6px;cursor:pointer;border:2px solid transparent}
.samples img.on{border-color:var(--accent)}
#status{color:var(--dim);font-size:13px;min-height:1.4em}
.found{color:var(--ok)}.assumed{color:var(--warn)}
input[type=file]{display:none}
</style>
<main>
  <h1>Character maker</h1>
  <section class="panel">
    <h2>Reference: drag a box edge to correct it</h2>
    <canvas id="ref"></canvas>
    <div class="row samples" id="samples"></div>
    <div class="row"><label class="btn">Choose image…<input type="file" id="file" accept="image/*"></label></div>
    <div id="status"></div>
  </section>
  <section class="panel">
    <h2>Blocky character</h2>
    <canvas id="view"></canvas>
    <div class="row" id="detail"><span style="color:var(--dim)">Detail</span></div>
    <div class="row"><button class="primary" id="play">Play as this character</button><button id="download">Download skin</button></div>
  </section>
</main>
<script type="module" src="../build/web/maker.js"></script>
